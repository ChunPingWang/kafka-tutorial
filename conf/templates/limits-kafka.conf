# =============================================================================
# Kafka 服務帳號的 ulimit 設定
#
# 安裝：
#   sudo cp conf/templates/limits-kafka.conf /etc/security/limits.d/99-kafka.conf
#   （用 systemd 啟動時，以 unit 檔裡的 LimitNOFILE 為準，這個檔案影響的是
#     互動式登入與非 systemd 啟動方式）
# =============================================================================

# 檔案描述符：每個 partition 的每個 segment 都要開檔，再加上每條 client 連線
kafka  soft  nofile  1048576
kafka  hard  nofile  1048576

# 行程／執行緒數
kafka  soft  nproc   65536
kafka  hard  nproc   65536

# 不要讓 broker 記憶體被換出
kafka  soft  memlock unlimited
kafka  hard  memlock unlimited
