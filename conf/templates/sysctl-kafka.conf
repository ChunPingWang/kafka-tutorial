# =============================================================================
# Kafka broker 主機的核心參數建議值
#
# 安裝：
#   sudo cp conf/templates/sysctl-kafka.conf /etc/sysctl.d/99-kafka.conf
#   sudo sysctl --system
#
# 每一項都附上理由；不要無腦照抄，請依實際硬體調整。
# =============================================================================

# ---- 記憶體 ----
# Kafka 極度仰賴 OS page cache 做讀取快取。一旦開始 swap，延遲會爆增。
# 設 1 而非 0：完全禁止 swap 在記憶體壓力下可能觸發 OOM killer。
vm.swappiness = 1

# 髒頁比例：太高會累積大量待寫資料，一次刷盤造成延遲尖峰；
# 太低則頻繁小量寫入。10/5 是吞吐與延遲的折衷。
vm.dirty_ratio = 60
vm.dirty_background_ratio = 5

# Kafka 用 mmap 處理 index 檔，partition 多時會用掉大量 mapping
vm.max_map_count = 262144

# ---- 檔案描述符 ----
fs.file-max = 2000000

# ---- 網路 ----
# 連線佇列：broker 重啟時大量 client 同時重連，佇列太小會被 drop
net.core.somaxconn = 32768
net.ipv4.tcp_max_syn_backlog = 32768
net.core.netdev_max_backlog = 32768

# socket buffer：跨機房複寫的高延遲鏈路特別需要大 buffer
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 65536 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# TIME_WAIT 連線重用：broker 會建立大量短連線
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# keepalive：及早發現斷掉的 client 連線，釋放資源
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
