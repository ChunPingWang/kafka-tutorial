# =============================================================================
# Kafka broker 主機的核心參數建議值
#
# 安裝：
#   sudo cp conf/templates/sysctl-kafka.conf /etc/sysctl.d/99-kafka.conf
#   sudo sysctl --system
#
# 每一項都附上理由；不要無腦照抄，請依實際硬體調整。
# =============================================================================

# ---- 記憶體 ----
# Kafka 極度仰賴 OS page cache 做讀取快取。一旦開始 swap，延遲會爆增。
# 設 1 而非 0：完全禁止 swap 在記憶體壓力下可能觸發 OOM killer。
vm.swappiness = 1

# 髒頁比例：Kafka 是循序寫入 + 依賴 page cache 的工作負載，
# 官方調校建議把 dirty_ratio 拉高（60–80），讓背景 flush（5%）持續進行、
# 前景 hard limit 幾乎不會被碰到；一般伺服器常見的 10/5 反而會讓
# 高吞吐寫入頻繁觸發同步刷盤。延遲極度敏感的場景可自行調低並實測。
vm.dirty_ratio = 60
vm.dirty_background_ratio = 5

# Kafka 用 mmap 處理 index 檔，partition 多時會用掉大量 mapping
vm.max_map_count = 262144

# ---- 檔案描述符 ----
fs.file-max = 2000000

# ---- 網路 ----
# 連線佇列：broker 重啟時大量 client 同時重連，佇列太小會被 drop
net.core.somaxconn = 32768
net.ipv4.tcp_max_syn_backlog = 32768
net.core.netdev_max_backlog = 32768

# socket buffer：跨機房複寫的高延遲鏈路特別需要大 buffer
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 65536 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# TIME_WAIT 連線重用：broker 會建立大量短連線
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# keepalive：及早發現斷掉的 client 連線，釋放資源
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
