# =============================================================================
# 三節點 Kafka 叢集（KRaft 模式）—— 用來學習與測試「多節點才看得到」的行為
#
# 這個組態刻意做成「像正式環境」：RF=3、min.insync.replicas=2、
# 關閉自動建立 topic，讓你在本機就能練到副本、ISR、leader 選舉。
#
# 啟動：
#   docker compose -f docker/docker-compose.yml up -d
#   BOOTSTRAP_SERVERS=localhost:19092 ./scripts/test/smoke-test.sh
#
# 故障演練：
#   BOOTSTRAP_SERVERS=localhost:19092 ./scripts/test/resilience-test.sh --docker kafka-2
#
# 停止並清空：
#   docker compose -f docker/docker-compose.yml down -v
#
# 對外 port：
#   kafka-1 -> localhost:19092
#   kafka-2 -> localhost:29092
#   kafka-3 -> localhost:39092
#   Kafka UI -> http://localhost:8080
# =============================================================================

x-kafka-common: &kafka-common
  image: apache/kafka:4.1.2
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s

x-kafka-env: &kafka-env
  # ---- KRaft ----
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # 三個節點必須共用同一個 cluster id
  CLUSTER_ID: kafka-tutorial-cluster
  # ---- listener ----
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # ---- 可靠性：刻意用正式環境的值 ----
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # ---- 其他 ----
  KAFKA_NUM_PARTITIONS: 6
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_LOG_RETENTION_HOURS: 24
  KAFKA_HEAP_OPTS: -Xmx512M -Xms512M

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "19092:19092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      # INTERNAL 給 container 之間用，EXTERNAL 給主機上的 client 用。
      # 兩個位址都要公告，否則主機連得上 bootstrap 卻連不到 broker。
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks: [kafka-net]

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "29092:29092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks: [kafka-net]

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "39092:39092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks: [kafka-net]

  # 圖形化介面：看 topic、訊息、consumer lag 最快的方式
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-3-node
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    networks: [kafka-net]

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

networks:
  kafka-net:
    driver: bridge
