# =============================================================================
# 災難備援演練環境：兩座獨立叢集 + MirrorMaker 2
#
# 用來練習：跨叢集複寫、量測 RPO、執行 failover、failback。
#
# 啟動：
#   docker compose -f docker/docker-compose.dr.yml up -d
#
# 主叢集   -> localhost:18092  （別名 dc1）
# 備援叢集 -> localhost:28092  （別名 dc2）
# （port 刻意與三節點練習環境的 19092/29092/39092 錯開，兩套可同時存在）
#
# 演練：
#   BOOTSTRAP_SERVERS=localhost:18092 ./scripts/test/smoke-test.sh
#   ./scripts/dr/setup-mirrormaker.sh --source-alias dc1 --source localhost:18092 \
#                                     --target-alias dc2 --target localhost:28092 --rf 1 --start
#   ./scripts/dr/dr-status.sh --source-alias dc1 --source localhost:18092 --target localhost:28092
#   ./scripts/dr/failover.sh --source-alias dc1 --source localhost:18092 \
#                            --target-alias dc2 --target localhost:28092 --drill
# =============================================================================

x-kafka-common: &kafka-common
  image: apache/kafka:4.1.2
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s

services:
  # ---- 主叢集 dc1 ----
  dc1-kafka:
    <<: *kafka-common
    container_name: dc1-kafka
    hostname: dc1-kafka
    ports: ["18092:18092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@dc1-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:18092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://dc1-kafka:9092,EXTERNAL://localhost:18092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
      # 一定要指向 volume 掛載點：映像檔預設寫 /tmp/kafka-logs（可寫層），
      # 不設這個的話 volume 形同虛設，down 之後資料就沒了
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # cluster id 必須是 22 字元的 base64url 字串（KRaft 的 UUID 格式）
      CLUSTER_ID: dr-demo-dc1-cluster-00
    volumes: ["dc1-data:/var/lib/kafka/data"]
    networks: [dr-net]

  # ---- 備援叢集 dc2 ----
  dc2-kafka:
    <<: *kafka-common
    container_name: dc2-kafka
    hostname: dc2-kafka
    ports: ["28092:28092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@dc2-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:28092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://dc2-kafka:9092,EXTERNAL://localhost:28092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: dr-demo-dc2-cluster-00
    volumes: ["dc2-data:/var/lib/kafka/data"]
    networks: [dr-net]

volumes:
  dc1-data:
  dc2-data:

networks:
  dr-net:
    driver: bridge
