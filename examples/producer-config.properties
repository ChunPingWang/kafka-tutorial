# =============================================================================
# Producer 設定範例：三種典型情境
# 用法：kafka-console-producer.sh --producer.config examples/producer-config.properties
#       或在應用程式中以相同的 key 設定
# =============================================================================

bootstrap.servers=localhost:9092
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer

# -----------------------------------------------------------------------------
# 情境 A：金流／訂單 —— 絕對不能掉，可以接受慢一點
# -----------------------------------------------------------------------------
# 要求所有 in-sync 副本都寫入才回 ack
acks=all
# 冪等性：broker 會過濾重試造成的重複，讓「重試」變安全
# （Kafka 3.0 起預設為 true，這裡明寫是為了清楚表達意圖）
enable.idempotence=true
# 無限重試，交給 delivery.timeout.ms 控制總時限
retries=2147483647
# 一則訊息從 send() 到放棄的總時間上限。超過就是真的失敗，要走補償流程。
delivery.timeout.ms=120000
request.timeout.ms=30000
# 開啟冪等性後這個值最多 5，且仍能保證順序
max.in.flight.requests.per.connection=5

# -----------------------------------------------------------------------------
# 情境 B：高吞吐 —— log、事件追蹤，允許極小機率遺失
# -----------------------------------------------------------------------------
#acks=1
#enable.idempotence=false
#linger.ms=50               # 等 50ms 湊一批，吞吐大幅提升
#batch.size=262144          # 256KB
#compression.type=zstd      # 文字類資料常有 3-5 倍壓縮率
#buffer.memory=134217728    # 128MB 傳送緩衝

# -----------------------------------------------------------------------------
# 情境 C：低延遲 —— 互動式請求，慢一毫秒都有感
# -----------------------------------------------------------------------------
#acks=1
#linger.ms=0                # 不等批次，立刻送
#batch.size=16384
#compression.type=none      # 壓縮會增加延遲
#max.block.ms=1000          # 緩衝滿了最多阻塞 1 秒就丟例外

# -----------------------------------------------------------------------------
# 通用調校
# -----------------------------------------------------------------------------
# 批次大小與等待時間：吞吐與延遲的主要旋鈕
linger.ms=20
batch.size=131072
compression.type=lz4
# 傳送緩衝總量；滿了之後 send() 會阻塞 max.block.ms
buffer.memory=67108864
max.block.ms=60000
# 單則訊息上限，必須 <= broker 的 message.max.bytes
max.request.size=1048576
# 連線閒置多久後關閉
connections.max.idle.ms=540000
