# =============================================================================
# Consumer 設定範例
# 用法：kafka-console-consumer.sh --consumer.config examples/consumer-config.properties
# =============================================================================

bootstrap.servers=localhost:9092
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
group.id=my-service

# -----------------------------------------------------------------------------
# offset 管理 —— 這裡決定了「至少一次」還是「最多一次」
# -----------------------------------------------------------------------------
# 沒有已提交 offset 時從哪開始：
#   earliest = 從最舊的開始（重跑歷史資料、避免漏訊息）
#   latest   = 只收新訊息（監控類，不在乎歷史）
#   none     = 直接報錯（要求 offset 必須存在）
auto.offset.reset=earliest

# 關閉自動提交，改成「處理成功後才手動 commit」。
# 自動提交的問題：offset 可能在訊息還沒處理完就被提交，當機時會漏訊息。
enable.auto.commit=false
# 若真的要用自動提交，把間隔調短可以縮小重複範圍（但無法完全避免）
#enable.auto.commit=true
#auto.commit.interval.ms=1000

# -----------------------------------------------------------------------------
# poll 迴圈 —— consumer 被踢出 group 的頭號原因
# -----------------------------------------------------------------------------
# 兩次 poll() 的最大間隔。處理一批訊息若超過這個時間，
# consumer 會被判定死亡並觸發 rebalance。
# 規則：max.poll.interval.ms > max.poll.records × 單則最壞處理時間
max.poll.interval.ms=300000
# 一次 poll 最多拿幾筆。處理很慢時要調小，否則容易超時。
max.poll.records=500

# 心跳與 session：偵測 consumer 死亡的速度
# 準則：heartbeat.interval.ms 約為 session.timeout.ms 的 1/3
session.timeout.ms=45000
heartbeat.interval.ms=15000

# -----------------------------------------------------------------------------
# 抓取效能
# -----------------------------------------------------------------------------
# broker 至少湊到這麼多資料才回應（配合 fetch.max.wait.ms）
fetch.min.bytes=1
fetch.max.wait.ms=500
# 單次 fetch 上限
fetch.max.bytes=52428800
max.partition.fetch.bytes=1048576

# -----------------------------------------------------------------------------
# 交易語意
# -----------------------------------------------------------------------------
# read_committed：只讀已提交的交易訊息（搭配交易型 producer）
# read_uncommitted：全部都讀（預設）
isolation.level=read_committed

# -----------------------------------------------------------------------------
# Rebalance 策略
# -----------------------------------------------------------------------------
# CooperativeStickyAssignor：漸進式 rebalance，不需要「全部停下再重分配」，
# 對延遲敏感的服務差別很大。新專案建議都用這個。
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
